name: Update Team Profiles

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Generate profile biographies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-profiles.js

      - name: Commit updated profiles
        run: |
          git config user.name "ami-profile-bot"
          git config user.email "bot@ami-labs.vercel.app"
          git add data/team.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update team biographies [$(date -u +%Y-%m-%d)]"
            git push
          fi
