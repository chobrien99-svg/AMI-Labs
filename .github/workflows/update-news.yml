name: Update News Feed

on:
  # schedule:
  #   - cron: "0 8 * * *"  # Disabled — pulling in too much junk; re-enable after feed is fixed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Fetch and summarize news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/update-news.js

      - name: Commit updated news
        run: |
          git config user.name "ami-news-bot"
          git config user.email "bot@ami-labs.vercel.app"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update news feed [$(date -u +%Y-%m-%d)]"
            git push
          fi
