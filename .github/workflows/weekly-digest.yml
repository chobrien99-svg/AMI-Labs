name: Weekly Email Digest

on:
  schedule:
    - cron: "0 9 * * 1"   # Every Monday at 9am UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write   # to commit data/research-digest-seen.json (the new-research diff state)

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send weekly digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
          DIGEST_REPLY_TO: ${{ vars.DIGEST_REPLY_TO }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          # Signs the per-recipient unsubscribe links. Must match the value the site
          # uses for /api/confirm and /api/unsubscribe, or the links will not verify.
          CONFIRM_SECRET: ${{ secrets.CONFIRM_SECRET }}
        run: node scripts/send-digest.js

      - name: Commit new-research digest state
        run: |
          git config user.name "ami-news-bot"
          git config user.email "bot@ami-labs.vercel.app"
          git add data/research-digest-seen.json
          if git diff --staged --quiet; then
            echo "No research-state changes to commit."
          else
            git commit -m "chore: update weekly-digest research state [$(date -u +%Y-%m-%d)]"
            git push
          fi
