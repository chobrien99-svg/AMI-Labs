name: Build Person Dossiers

# Regenerates the per-person dossiers + relationship graph under data/people/ by
# joining team.json, research.json, github-analysis.json, github-activity.json,
# news.json and x-posts.json. First syncs manually-authored Sanity articles (with
# their curated people tags) into news.json, so hand-added items reach the dossiers.
# Runs daily (after the data-fetch workflows) and on demand. Deterministic — commits
# only when the joined output actually changes.

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * *" # daily at 07:45 UTC, after the fetch/analyze jobs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync articles from Sanity
        continue-on-error: true # a Sanity outage must not block the dossier rebuild
        env:
          # Optional — public dataset reads without it; only needed for a private dataset.
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: node scripts/export-sanity-news.js

      - name: Build dossiers
        run: node scripts/build-dossiers.js

      - name: Commit dossiers
        run: |
          git config user.name "ami-activity-bot"
          git config user.email "bot@ami-labs.vercel.app"
          git add data/news.json data/people
          if git diff --staged --quiet; then
            echo "No dossier changes to commit."
          else
            git commit -m "chore: rebuild person dossiers [$(date -u +%Y-%m-%d)]"
            git push
          fi
