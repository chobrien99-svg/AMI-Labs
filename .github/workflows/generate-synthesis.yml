name: Generate Observatory Briefing

on:
  schedule:
    - cron: "0 20 * * 0"  # Sunday 20:00 UTC (~Sun night in Paris) — leaves the night + Mon morning to review & publish before the Mon 09:00 digest
  workflow_dispatch:
    inputs:
      preserve_snapshot:
        description: "Test/preview run: generate the draft but DON'T advance the diff baseline (so a new hire/paper/filing still surfaces on the next scheduled run)."
        type: boolean
        default: true
      census:
        description: "One-off 'State of AMI' census: survey the FULL current picture (all papers/jobs/officers/filings), not just the week. Advances the baseline, so the next run returns to weekly deltas."
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  generate-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Generate briefing draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYNTHESIS_MODEL: ${{ vars.SYNTHESIS_MODEL }}
          SYNTHESIS_WINDOW_DAYS: ${{ vars.SYNTHESIS_WINDOW_DAYS }}
          # Empty on scheduled runs (baseline advances); "true" by default on manual runs (baseline preserved).
          SYNTHESIS_PRESERVE_SNAPSHOT: ${{ github.event.inputs.preserve_snapshot }}
          # "true" only for a deliberate one-off full-state census; empty otherwise.
          SYNTHESIS_CENSUS: ${{ github.event.inputs.census }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-synthesis.js

      - name: Commit briefing draft
        run: |
          git config user.name "ami-synthesis-bot"
          git config user.email "bot@ami-labs.vercel.app"
          git add data/synthesis.pending.json
          if git diff --staged --quiet; then
            echo "No draft changes to commit."
          else
            git commit -m "chore: draft observatory briefing [$(date -u +%Y-%m-%d)]"
            git push
          fi
